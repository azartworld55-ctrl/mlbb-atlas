name: Deploy MLBB Atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/heroes/current.json"
      - "data/items/current.json"
      - "data/skill_versions/current.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static data
        run: |
          mkdir -p site/data
          cp data/heroes/current.json site/data/heroes.json
          cp data/items/current.json site/data/items.json
          cp data/skill_versions/current.json site/data/skills.json
      - name: Validate JSON data
        run: |
          python -m json.tool site/data/heroes.json > /dev/null
          python -m json.tool site/data/items.json > /dev/null
          python -m json.tool site/data/skills.json > /dev/null
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
