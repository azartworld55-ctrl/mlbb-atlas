[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbb-atlas"
version = "0.1.0"
description = "Community MLBB reference database, website and API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
